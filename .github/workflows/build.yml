name: Build

# Checks the server mod builds. Releases are made locally with scripts/package.ps1: the client
# plugin compiles against the game's own assemblies, which aren't available here, so a zip made
# here would be missing the plugin and the editor.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build server mod
        run: dotnet build src/ChangeIcons/ChangeIcons.csproj -c Release
